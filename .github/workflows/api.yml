name: Update API feeds

on:
  schedule:
    - cron: '23 * * * *'   # every hour (GitHub runs schedules only on the default branch)
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-api.mjs'
      - 'api/empty-string.js'

permissions:
  contents: write

concurrency:
  group: api-feeds
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build feeds
        run: node scripts/build-api.mjs
      - name: Commit changes
        run: |
          git config user.name "empty.string bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/v1
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update API feeds [skip ci]"
          git push
